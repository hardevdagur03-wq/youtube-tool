# AlertManager configuration for alert routing and notification.

global:
  resolve_timeout: 5m
  smtp_smarthost: "localhost:25"
  smtp_from: "alerts@ytblog.com"
  smtp_require_tls: false

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: "slack-critical"
      match:
        severity: "critical"
      continue: true
    - receiver: "email-admin"
      match:
        severity: "critical"
    - receiver: "slack-high"
      match:
        severity: "high"
    - receiver: "default"
      match_re:
        severity: "warning|info"

receivers:
  - name: "default"
    slack_configs: []
    email_configs: []

  - name: "slack-critical"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/..."  # Set via environment
        channel: "#alerts-critical"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }} [{{ .Labels.severity }}]'
        text: '{{ .CommonAnnotations.description }}'

  - name: "slack-high"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/..."
        channel: "#alerts-high"
        send_resolved: true

  - name: "email-admin"
    email_configs:
      - to: "admin@example.com"
        send_resolved: true
