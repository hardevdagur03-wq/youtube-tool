version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-deploy: &default-deploy
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3
    window: 120s
  update_config:
    parallelism: 2
    delay: 10s
    order: start-first
  rollback_config:
    parallelism: 1
    delay: 10s
    order: stop-first

services:
  postgres:
    image: postgres:16-alpine
    container_name: yt-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-yt_blog}
      POSTGRES_USER: ${DB_USER:-ytblog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ytblog} -d ${DB_NAME:-yt_blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: yt-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.25'
          memory: 256M

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: yt-api
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-youtube-seo-blog}/api:${IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-ytblog}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      DB_NAME: ${DB_NAME:-yt_blog}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      <<: *default-deploy
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: yt-worker
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-youtube-seo-blog}/worker:${IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-ytblog}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      DB_NAME: ${DB_NAME:-yt_blog}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A background_processing.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging
    deploy:
      <<: *default-deploy
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  beat:
    build:
      context: ..
      dockerfile: Dockerfile.beat
    container_name: yt-beat
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-youtube-seo-blog}/beat:${IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy:
      <<: *default-deploy
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ../frontend
      dockerfile: ../Dockerfile.frontend
    container_name: yt-frontend
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-youtube-seo-blog}/frontend:${IMAGE_TAG:-latest}
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      <<: *default-deploy
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  nginx:
    image: nginx:1.25-alpine
    container_name: yt-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - ../webapp/static:/var/www/static:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      <<: *default-deploy
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  flower:
    image: mher/flower:2.0
    container_name: yt-flower
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555", "--url-prefix=flower"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local





