groups:
  - name: youtube_seo_alerts
    interval: 30s
    rules:
      # Service availability
      - alert: APIInstanceDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API instance {{ $labels.instance }} is down"
          description: "API instance has been unreachable for more than 1 minute."

      - alert: WorkerInstanceDown
        expr: up{job="worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Worker instance {{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High error rate ({{ $value | humanizePercentage }})"
          description: "API error rate is above 5% for the last 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High p95 latency ({{ $value }}s)"
          description: "p95 API latency is above 2 seconds"

      - alert: QueueBacklog
        expr: celery_queue_length > 1000
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Queue backlog ({{ $value }} jobs)"
          description: "Job queue has more than 1000 pending tasks"

      # Resource alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "High CPU usage ({{ $value | humanizePercentage }})"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "High memory usage ({{ $value | humanizePercentage }})"

      - alert: DiskSpaceRunningOut
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space below 10% ({{ $value | humanizePercentage }} available)"

      # Database alerts
      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 100
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High PostgreSQL connections ({{ $value }})"

      # Redis alerts
      - alert: RedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Redis memory usage ({{ $value | humanizePercentage }})"

      # Cache alerts
      - alert: CacheHitRateLow
        expr: rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) * 100 < 50
        for: 15m
        labels:
          severity: medium
        annotations:
          summary: "Cache hit rate below 50%"

      # Business alerts
      - alert: PipelineFailureRateHigh
        expr: rate(pipeline_failures_total[1h]) > 10
        for: 15m
        labels:
          severity: high
        annotations:
          summary: "High pipeline failure rate ({{ $value }}/hour)"

      - alert: LLMLatencyHigh
        expr: histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: medium
        annotations:
          summary: "High LLM latency ({{ $value }}s p95)"
