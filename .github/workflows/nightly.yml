name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM daily
  workflow_dispatch:

jobs:
  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install pytest-asyncio pytest-cov pytest-timeout httpx psutil
      - name: Run full test suite
        run: |
          pytest tests/ -v --timeout=300 --ignore=tests/load --ignore=tests/stress --ignore=tests/chaos -x --cov=. --cov-report=xml --cov-report=term
        continue-on-error: true
      - name: Run security tests
        run: |
          pytest tests/security/ -v --timeout=120 --run-security -x
        continue-on-error: true
      - name: Run load tests
        run: |
          pip install locust
          locust --headless -f tests/load/locustfile.py -u 100 -r 10 --run-time 5m --host https://yourdomain.com --csv=locust_report
        continue-on-error: true
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            coverage.xml
            locust_report*.csv
            tests/reports/
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run benchmarks
        run: |
          pytest tests/benchmarks/ -v --timeout=600 --run-benchmark

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan Python deps
        uses: pypa/gh-action-pip-audit@v1
        with:
          inputs: requirements.txt
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on
        continue-on-error: true
