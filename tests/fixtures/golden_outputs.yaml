golden_outputs:
  - id: golden_001
    name: "RAG Pipeline Introduction"
    description: "Expected output for the introduction section of a RAG pipeline tutorial blog post"
    metrics:
      min_word_count: 150
      max_word_count: 300
      min_seo_score: 75.0
      min_readability_score: 65.0
      max_ai_detection_score: 50.0
      min_keyword_density: 0.01
      max_keyword_density: 0.04
    validation_rules:
      - rule: "contains_primary_keyword"
        field: "content"
        description: "Primary keyword must appear in the first paragraph"
      - rule: "has_hook"
        field: "content"
        description: "Introduction must start with an engaging hook"
      - rule: "has_reader_promise"
        field: "content"
        description: "Must clearly state what the reader will learn"
      - rule: "word_count_in_range"
        field: "word_count"
        description: "Word count must be between min and max"
      - rule: "no_placeholder_text"
        field: "content"
        description: "Content must not contain placeholder or lorem ipsum text"
    expected_output_structure:
      type: "blog_section"
      required_fields:
        - "heading"
        - "content"
        - "word_count"
      optional_fields:
        - "key_points"
        - "entities"
        - "readability_score"
    quality_criteria:
      grammar_min: 90.0
      spelling_min: 95.0
      originality_min: 80.0
      coherence_min: 85.0
      relevance_min: 90.0

  - id: golden_002
    name: "SEO Analysis for Technical Tutorial"
    description: "Expected output structure and quality metrics for SEO analysis of a technical tutorial"
    metrics:
      min_overall_seo_score: 75.0
      min_keyword_score: 70.0
      min_structure_score: 65.0
      min_headings_count: 4
      min_faq_count: 3
      max_meta_title_length: 60
      min_meta_title_length: 30
      max_meta_description_length: 160
      min_meta_description_length: 120
    validation_rules:
      - rule: "has_primary_keyword"
        field: "keyword_analysis"
        description: "Primary keyword must be defined"
      - rule: "has_secondary_keywords"
        field: "keyword_analysis"
        description: "At least 3 secondary keywords must be present"
      - rule: "meta_title_length_valid"
        field: "meta_tags"
        description: "Meta title must be between 30 and 60 characters"
      - rule: "meta_description_length_valid"
        field: "meta_tags"
        description: "Meta description must be between 120 and 160 characters"
      - rule: "has_faq_items"
        field: "faq_items"
        description: "At least 3 FAQ items must be generated"
      - rule: "url_slug_contains_keyword"
        field: "url_slug"
        description: "URL slug must contain the primary keyword"
    expected_output_structure:
      type: "seo_analysis"
      required_fields:
        - "keyword_analysis"
        - "intent_analysis"
        - "audience_analysis"
        - "heading_strategy"
        - "meta_tags"
        - "url_slug"
      optional_fields:
        - "competitor_insights"
        - "schema_markup"
        - "internal_links"
        - "external_links"
        - "faq_items"
        - "featured_snippet_targets"
    quality_criteria:
      keyword_relevance_min: 85.0
      intent_accuracy_min: 80.0
      audience_match_min: 75.0
      competitor_coverage_min: 60.0
      schema_completeness_min: 70.0

  - id: golden_003
    name: "Knowledge Graph for Technical Content"
    description: "Expected knowledge graph structure for a technical tutorial video"
    metrics:
      min_entities: 5
      min_relationships: 5
      min_keywords: 8
      min_facts: 3
      min_pain_points: 2
      min_solutions: 2
      min_quality_score: 60.0
    validation_rules:
      - rule: "has_entities"
        field: "entities"
        description: "At least 5 entities must be extracted"
      - rule: "has_relationships"
        field: "relationships"
        description: "At least 5 relationships must be established"
      - rule: "has_keywords"
        field: "keywords"
        description: "At least 8 keywords must be extracted"
      - rule: "entity_types_diverse"
        field: "entities"
        description: "Entities must cover at least 3 different types"
      - rule: "relationships_have_weights"
        field: "relationships"
        description: "Each relationship must have a weight between 0 and 1"
      - rule: "has_semantic_clusters"
        field: "semantic_clusters"
        description: "At least 2 semantic clusters must be identified"
    expected_output_structure:
      type: "knowledge_graph"
      required_fields:
        - "entities"
        - "relationships"
        - "keywords"
        - "facts"
      optional_fields:
        - "pain_points"
        - "solutions"
        - "timeline"
        - "statistics"
        - "definitions"
        - "quotes"
        - "semantic_clusters"
    quality_criteria:
      entity_accuracy_min: 85.0
      relationship_accuracy_min: 75.0
      keyword_relevance_min: 80.0
      fact_accuracy_min: 90.0
      semantic_coherence_min: 70.0

  - id: golden_004
    name: "Blog Draft Quality Standards"
    description: "Quality standards for final blog draft output"
    metrics:
      min_word_count: 1500
      max_word_count: 4000
      min_sections: 4
      min_overall_quality_score: 80.0
      min_seo_score: 75.0
      min_readability_score: 65.0
      max_passive_voice_percentage: 15.0
      max_ai_detection_probability: 60.0
    validation_rules:
      - rule: "has_title"
        field: "title"
        description: "Blog post must have a title"
      - rule: "has_introduction"
        field: "content"
        description: "Blog post must have an introduction section"
      - rule: "has_conclusion"
        field: "content"
        description: "Blog post must have a conclusion section"
      - rule: "has_table_of_contents"
        field: "toc"
        description: "Blog post must have a table of contents"
      - rule: "markdown_valid"
        field: "content"
        description: "Content must be valid markdown"
      - rule: "no_hallucinated_facts"
        field: "content"
        description: "Content must not contain factually incorrect statements"
      - rule: "keyword_in_title"
        field: "title"
        description: "Primary keyword must appear in the title"
      - rule: "keyword_in_introduction"
        field: "content"
        description: "Primary keyword must appear in the introduction"
      - rule: "has_code_or_examples"
        field: "sections"
        description: "Technical posts must include code examples or practical examples"
    expected_output_structure:
      type: "blog_draft"
      required_fields:
        - "title"
        - "content"
        - "sections"
        - "word_count"
        - "metadata"
      optional_fields:
        - "toc"
        - "references"
        - "faq"
        - "call_to_action"
    quality_criteria:
      grammar_min: 90.0
      spelling_min: 95.0
      structure_min: 80.0
      coherence_min: 85.0
      engagement_min: 70.0
      technical_accuracy_min: 90.0
      uniqueness_min: 80.0

  - id: golden_005
    name: "Export Format Specifications"
    description: "Expected format and structure for exported blog content"
    metrics:
      min_word_count: 1500
      min_markdown_headings: 4
      min_html_sections: 4
      max_file_size_bytes: 100000
      export_duration_max_ms: 5000
    validation_rules:
      - rule: "markdown_has_h1"
        field: "markdown"
        description: "Markdown export must have exactly one H1 heading"
      - rule: "markdown_has_h2"
        field: "markdown"
        description: "Markdown export must have at least 4 H2 headings"
      - rule: "html_has_article_tag"
        field: "html"
        description: "HTML export must use semantic article tag"
      - rule: "html_has_schema"
        field: "html"
        description: "HTML export must include schema.org metadata"
      - rule: "html_has_meta_tags"
        field: "html"
        description: "HTML export must include meta description and keywords"
      - rule: "metadata_has_all_fields"
        field: "metadata"
        description: "Export metadata must include title, author, date, word_count, format, version"
    expected_output_structure:
      type: "export"
      required_fields:
        - "format"
        - "content"
        - "metadata"
        - "success"
      optional_fields:
        - "file_path"
        - "file_size"
        - "duration_ms"
    quality_criteria:
      markdown_validity_min: 100.0
      html_validity_min: 95.0
      metadata_completeness_min: 100.0
      schema_accuracy_min: 90.0
